version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowspike_db
    environment:
      POSTGRES_USER: shadowuser
      POSTGRES_PASSWORD: shadowpass
      POSTGRES_DB: shadowspike
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shadowspike_redis
    ports:
      - "6379:6379"
    restart: unless-stopped